<!-- Supabase 클라이언트 라이브러리 (버전 고정 & UMD 빌드) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>

<!-- Supabase 초기화 -->
<script>
  (function () {
    const supabaseUrl = 'https://ipdkvuybgxczqwwmrqsw.supabase.co';
    const supabaseKey = 'sb_publishable_Hk_7I7kkgaAKrPLQz_sdUA_XvrKoJbI';
    const tacticProxyUrl = 'https://api.lufel.net';
    let tacticProxyHealth = null;

    async function tacticProxyIsReady() {
      if (!tacticProxyHealth || Date.now() - tacticProxyHealth.checkedAt > 60000) {
        const checkedAt = Date.now();
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2000);
        const check = fetch(`${tacticProxyUrl}/health`, { signal: controller.signal })
          .then(response => response.ok)
          .catch(() => false)
          .finally(() => clearTimeout(timeout));
        tacticProxyHealth = { checkedAt, check };
      }
      return tacticProxyHealth.check;
    }

    async function fetchWithTacticCache(input, init) {
      const sourceUrl = new URL(typeof input === 'string' ? input : input.url);
      const method = (init?.method || (typeof input === 'string' ? 'GET' : input.method)).toUpperCase();
      const isTacticRequest = sourceUrl.origin === supabaseUrl &&
        /^\/rest\/v1\/(tactics|tactic_likes)$/.test(sourceUrl.pathname);
      if (!isTacticRequest || window.location.hostname !== 'lufel.net') {
        return fetch(input, init);
      }

      if (method !== 'GET' && method !== 'HEAD' && !(await tacticProxyIsReady())) {
        return fetch(input, init);
      }

      const targetUrl = tacticProxyUrl + sourceUrl.pathname + sourceUrl.search;
      const target = typeof input === 'string' ? targetUrl : new Request(targetUrl, input);
      try {
        const response = await fetch(target, init);
        if ((method === 'GET' || method === 'HEAD') && response.status >= 500) return fetch(input, init);
        return response;
      } catch (error) {
        if (method === 'GET' || method === 'HEAD') return fetch(input, init);
        throw error;
      }
    }

    const supaGlobal = window.supabase;
    const createClient = supaGlobal && typeof supaGlobal.createClient === 'function'
      ? supaGlobal.createClient
      : null;

    if (!createClient) {
      console.error('[Supabase] createClient 를 찾을 수 없습니다. 전역 supabase 구조가 예상과 다릅니다.', supaGlobal);
      return;
    }

    const client = createClient(supabaseUrl, supabaseKey, {
      global: { fetch: fetchWithTacticCache },
      auth: {
        persistSession: true,            // 세션을 브라우저 로컬스토리지에 저장
        autoRefreshToken: true,          // 액세스 토큰 자동 갱신
        detectSessionInUrl: true         // URL 해시에서 세션 토큰 자동 추출
      }
    });

    // 전역에서 사용하는 supabase 를 "클라이언트 인스턴스"로 고정
    window.supabase = client;
  })();
</script>

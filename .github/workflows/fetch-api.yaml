name: Fetch External Core every 6h

on:
  schedule:
    - cron: "0 */6 * * *" # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-external-core
  cancel-in-progress: false

jobs:
  fetch-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch core data
        env:
          BASE_URL: https://p5x.iant.kr/data
          FETCH_MODE: core
        run: |
          bash scripts/fetch-external-data.sh

      - name: Commit & Push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(data): update external core json [skip ci]" || echo "No changes to commit"
            git push || echo "Nothing to push or push skipped."
          else
            echo "No changes found."
          fi

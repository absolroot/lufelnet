{% assign nitro_ad_format = include.format | default: 'banner' %}
{% assign nitro_ad_placeholder = include.placeholder | default: false %}
<div class="nitro-ad-container nitro-ad-container--{{ nitro_ad_format }}{% if include.class %} {{ include.class }}{% endif %}{% if nitro_ad_placeholder %} nitro-ad-container--with-placeholder{% endif %}">
  <div class="nitro-ad-slot-frame">
    <div id="{{ include.id }}" class="nitro-ad-slot" data-nitro-ad data-nitro-format="{{ nitro_ad_format }}"{% if include.lazy %} data-nitro-render-visible-only="true"{% endif %}{% if include.visible_margin %} data-nitro-visible-margin="{{ include.visible_margin }}"{% endif %}{% if include.start_after %} data-nitro-start-after="{{ include.start_after }}"{% endif %}></div>
    {% if nitro_ad_placeholder %}
    <div class="nitro-ad-placeholder" data-nitro-ad-placeholder aria-hidden="true">
      <span data-i18n="footer.advertisement">Advertisement</span>
    </div>
    {% endif %}
  </div>
</div>
